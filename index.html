<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><title>Scrapbook Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9e7e3;color:#292826;font-family:Arial,sans-serif}.top{padding:12px 16px;background:#272624;color:#fff;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.top strong{font-family:Georgia,serif;font-weight:normal;font-size:20px;margin-right:auto}.btn{border:0;border-radius:8px;padding:10px 12px;background:#f3f0ea;color:#292826;font-size:14px;cursor:pointer}.btn.dark{background:#45423f;color:#fff}.btn:active{opacity:.8}.layout{display:grid;grid-template-columns:260px 1fr 260px;gap:12px;padding:12px;min-height:calc(100vh - 56px)}.panel{background:#f8f7f4;border-radius:12px;padding:12px;overflow:auto}.panel h3{font:18px Georgia;margin:5px 0 12px}.panel p{font-size:12px;line-height:1.5;color:#666}.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tools .btn{background:#e6e2dc}.stage-wrap{display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:10px;background:#d6d3ce;border-radius:12px}.stage{position:relative;width:900px;height:600px;flex:none;background:#f5f3ef;box-shadow:0 5px 20px #0002;overflow:hidden;transform-origin:top center}.layer{position:absolute;touch-action:none;cursor:move;user-select:none}.layer.selected{outline:2px solid #5786c7;outline-offset:2px}.paper{background:#fff;box-shadow:0 3px 9px #0002;padding:16px;font-family:Georgia,serif;white-space:pre-wrap}.photo-frame{background:#fff;padding:10px 10px 44px;box-shadow:0 4px 12px #0003;overflow:hidden}.photo-frame img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}.photo-frame .caption{position:absolute;left:0;right:0;bottom:9px;text-align:center;font-family:cursive;color:#666;font-size:18px;pointer-events:none}.sticker{font-size:52px;filter:drop-shadow(2px 3px 2px #0002)}.handle{position:absolute;width:14px;height:14px;right:-8px;bottom:-8px;border:2px solid #5786c7;background:white;border-radius:50%;cursor:nwse-resize}.controls label{display:block;font-size:12px;margin:12px 0 5px;color:#555}.controls input,.controls textarea,.controls select{width:100%;padding:8px;border:1px solid #ccc;border-radius:7px;background:white}.controls textarea{min-height:85px}.small{font-size:12px;color:#777}.empty{padding:12px;color:#777;font-size:13px}.hidden{display:none!important}.mini{font-size:11px;color:#777}
@media(max-width:850px){.layout{grid-template-columns:1fr}.panel{order:2}.stage-wrap{order:1;min-height:420px}.stage{transform:scale(.68);transform-origin:top center;margin-bottom:-190px}.top strong{width:100%}}
</style></head><body>
<div class="top"><strong>scrapbook studio</strong><button class="btn" id="addPhoto">＋ foto</button><button class="btn" id="addText">＋ texto</button><button class="btn" id="addSticker">＋ decoração</button><button class="btn" id="addPaper">＋ papel</button><button class="btn dark" id="saveProject">salvar projeto</button><button class="btn dark" id="exportPng">exportar PNG</button><button class="btn" id="reset">reiniciar</button><input id="file" type="file" accept="image/*" multiple hidden></div>
<div class="layout"><aside class="panel"><h3>elementos</h3><p>Toque em um elemento para selecionar. Arraste para mover; use a bolinha no canto para redimensionar.</p><div id="layers"></div><hr><h3>atalhos</h3><div class="tools"><button class="btn" id="front">trazer para frente</button><button class="btn" id="back">mandar para trás</button><button class="btn" id="duplicate">duplicar</button><button class="btn" id="delete">apagar</button></div><p class="mini">Dica: ao selecionar uma foto, use os controles de enquadramento no painel da direita.</p></aside>
<main class="stage-wrap"><div class="stage" id="stage"></div></main>
<aside class="panel controls"><h3>editar elemento</h3><div id="edit"><div class="empty">Selecione uma foto, texto ou decoração para editar.</div></div></aside></div>
<script>
const stage=document.getElementById('stage'), layers=document.getElementById('layers'), edit=document.getElementById('edit'), file=document.getElementById('file');let items=[],selected=null,uid=0;
const make=(type,x,y,w,h,extra={})=>({id:++uid,type,x,y,w,h,rot:extra.rot||0,text:extra.text||'',src:extra.src||'',caption:extra.caption||'',emoji:extra.emoji||'',font:extra.font||'Georgia',size:extra.size||22,color:extra.color||'#292826',bg:extra.bg||'#fff',posX:extra.posX??50,posY:extra.posY??50});
function add(item){items.push(item);render();select(item.id)}
function defaults(){items=[];uid=0;
add(make('paper',35,25,285,145,{text:'My dearest,\n\nthere are things I keep\ninside these photographs.',size:22}));
add(make('photo',35,190,235,245,{caption:'a little memory'}));
add(make('paper',315,30,265,100,{text:'Love can bloom on you.\nWill you bloom with it?',size:19}));
add(make('photo',345,155,250,235));
add(make('photo',610,50,230,195));
add(make('paper',625,280,230,155,{text:'Nicole\n\nI love you, endlessly.',size:22}));
add(make('photo',285,390,300,180));
add(make('sticker',260,120,70,70,{emoji:'🌿'}));add(make('sticker',580,360,75,75,{emoji:'📷'}));add(make('sticker',720,470,100,90,{emoji:'💿'}));add(make('sticker',90,465,80,75,{emoji:'🌼'}));
}
function render(){stage.innerHTML='';items.forEach(it=>{let el=document.createElement('div');el.className='layer '+(it.id===selected?'selected':'');el.dataset.id=it.id;el.style.left=it.x+'px';el.style.top=it.y+'px';el.style.width=it.w+'px';el.style.height=it.h+'px';el.style.transform=`rotate(${it.rot}deg)`;
if(it.type==='photo'){el.className+=' photo-frame';let img=document.createElement('img');if(it.src)img.src=it.src;img.style.objectPosition=`${it.posX}% ${it.posY}%`;el.appendChild(img);let cap=document.createElement('div');cap.className='caption';cap.textContent=it.caption;el.appendChild(cap)}
else if(it.type==='paper'){el.className+=' paper';el.style.background=it.bg;el.style.fontSize=it.size+'px';el.style.color=it.color;el.style.fontFamily=it.font;el.textContent=it.text}
else if(it.type==='sticker'){el.className+=' sticker';el.textContent=it.emoji}
if(it.id===selected){let h=document.createElement('div');h.className='handle';el.appendChild(h)}
el.addEventListener('pointerdown',e=>dragStart(e,it.id));el.addEventListener('click',e=>{e.stopPropagation();select(it.id)});stage.appendChild(el)});stage.onclick=()=>select(null);renderLayers();renderEdit()}
function select(id){selected=id;render()}
function renderLayers(){layers.innerHTML='';[...items].reverse().forEach(it=>{let b=document.createElement('button');b.className='btn';b.style.display='block';b.style.width='100%';b.style.margin='5px 0';b.style.textAlign='left';b.textContent=(it.type==='photo'?'▧ foto':it.type==='paper'?'▤ texto':'✦ decoração')+' · '+it.id;b.onclick=()=>select(it.id);layers.appendChild(b)})}
function renderEdit(){let it=items.find(x=>x.id===selected);if(!it){edit.innerHTML='<div class="empty">Selecione um elemento para editar.</div>';return}let html=`<div class="small">tipo: ${it.type}</div><label>posição X</label><input id="x" type="number" value="${it.x}"><label>posição Y</label><input id="y" type="number" value="${it.y}"><label>largura</label><input id="w" type="number" value="${it.w}"><label>altura</label><input id="h" type="number" value="${it.h}"><label>rotação</label><input id="rot" type="range" min="-180" max="180" value="${it.rot}">`;
if(it.type==='photo')html+=`<label>legenda</label><input id="caption" value="${esc(it.caption)}"><label>enquadramento horizontal</label><input id="posX" type="range" min="0" max="100" value="${it.posX}"><label>enquadramento vertical</label><input id="posY" type="range" min="0" max="100" value="${it.posY}"><button class="btn" id="replace" style="width:100%;margin-top:10px">trocar foto</button>`;
if(it.type==='paper')html+=`<label>texto</label><textarea id="text">${esc(it.text)}</textarea><label>tamanho da letra</label><input id="size" type="range" min="10" max="48" value="${it.size}"><label>cor do texto</label><input id="color" type="color" value="${it.color}"><label>fundo</label><input id="bg" type="color" value="${it.bg}"><label>fonte</label><select id="font"><option>Georgia</option><option>Arial</option><option>Courier New</option><option>cursive</option></select>`;
if(it.type==='sticker')html+=`<label>emoji / símbolo</label><input id="emoji" value="${esc(it.emoji)}"><label>tamanho</label><input id="size" type="range" min="20" max="120" value="${it.size||52}">`;
edit.innerHTML=html;['x','y','w','h','rot','caption','posX','posY','text','size','color','bg','font','emoji'].forEach(k=>{let el=document.getElementById(k);if(el)el.addEventListener('input',()=>{let v=el.value;it[k]=['x','y','w','h','rot','size','posX','posY'].includes(k)?Number(v):v;render()})});let rep=document.getElementById('replace');if(rep)rep.onclick=()=>{selected=it.id;file.click()};}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let drag=null;function dragStart(e,id){e.preventDefault();select(id);let it=items.find(x=>x.id===id);let isHandle=e.target.classList.contains('handle');drag={id,startX:e.clientX,startY:e.clientY,x:it.x,y:it.y,w:it.w,h:it.h,resize:isHandle};stage.setPointerCapture(e.pointerId);}
stage.addEventListener('pointermove',move);stage.addEventListener('pointerup',()=>drag=null);stage.addEventListener('pointercancel',()=>drag=null);
function move(e){if(!drag)return;let it=items.find(x=>x.id===drag.id);let scale=stage.getBoundingClientRect().width/stage.offsetWidth;let dx=(e.clientX-drag.startX)/scale,dy=(e.clientY-drag.startY)/scale;if(drag.resize){it.w=Math.max(40,drag.w+dx);it.h=Math.max(40,drag.h+dy)}else{it.x=drag.x+dx;it.y=drag.y+dy}render()}
document.getElementById('addPhoto').onclick=()=>file.click();file.onchange=()=>{[...file.files].forEach(f=>{let r=new FileReader();r.onload=()=>{let it=items.find(x=>x.id===selected&&x.type==='photo');if(it){it.src=r.result}else add(make('photo',100,100,230,250,{src:r.result})) ;render()};r.readAsDataURL(f)});file.value=''};
document.getElementById('addText').onclick=()=>add(make('paper',180,170,240,140,{text:'write something here…'}));document.getElementById('addPaper').onclick=()=>add(make('paper',150,150,240,150,{text:'your note'}));document.getElementById('addSticker').onclick=()=>add(make('sticker',200,200,75,75,{emoji:'🌷'}));
document.getElementById('delete').onclick=()=>{items=items.filter(x=>x.id!==selected);select(null)};document.getElementById('duplicate').onclick=()=>{let it=items.find(x=>x.id===selected);if(it){let copy={...it,id:++uid,x:it.x+20,y:it.y+20};add(copy)}};document.getElementById('front').onclick=()=>{let i=items.findIndex(x=>x.id===selected);if(i>=0){items.push(items.splice(i,1)[0]);render()}};document.getElementById('back').onclick=()=>{let i=items.findIndex(x=>x.id===selected);if(i>=0){items.unshift(items.splice(i,1)[0]);render()}};
document.getElementById('saveProject').onclick=()=>{let blob=new Blob([JSON.stringify(items,null,2)],{type:'application/json'});download(blob,'scrapbook-project.json')};
document.getElementById('reset').onclick=()=>{if(confirm('Reiniciar o mural?'))defaults()};
function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.getElementById('exportPng').onclick=async()=>{let c=document.createElement('canvas');c.width=stage.offsetWidth;c.height=stage.offsetHeight;let ctx=c.getContext('2d');ctx.fillStyle='#f5f3ef';ctx.fillRect(0,0,c.width,c.height);for(let it of items){ctx.save();ctx.translate(it.x+it.w/2,it.y+it.h/2);ctx.rotate(it.rot*Math.PI/180);let x=-it.w/2,y=-it.h/2;if(it.type==='paper'){ctx.fillStyle=it.bg;ctx.shadowColor='#0003';ctx.shadowBlur=8;ctx.fillRect(x,y,it.w,it.h);ctx.shadowBlur=0;ctx.fillStyle=it.color;ctx.font=`${it.size}px ${it.font}`;ctx.textBaseline='top';it.text.split('\n').forEach((line,i)=>ctx.fillText(line,x+15,y+15+i*it.size*1.25))}else if(it.type==='sticker'){ctx.font=`${it.size||52}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(it.emoji,0,0)}else{ctx.fillStyle='#fff';ctx.shadowColor='#0003';ctx.shadowBlur=9;ctx.fillRect(x,y,it.w,it.h);ctx.shadowBlur=0;let img=new Image();if(it.src){img.src=it.src;await img.decode().catch(()=>{});let iw=img.width,ih=img.height,fw=it.w-20,fh=it.h-54,scale=Math.max(fw/iw,fh/ih),sw=iw*scale,sh=ih*scale,sx=(sw-fw)*it.posX/100,sy=(sh-fh)*it.posY/100;ctx.save();ctx.beginPath();ctx.rect(x+10,y+10,fw,fh);ctx.clip();ctx.drawImage(img,x+10-sx,y+10-sy,sw,sh);ctx.restore()}ctx.fillStyle='#666';ctx.font='18px cursive';ctx.textAlign='center';ctx.fillText(it.caption,0,y+it.h-22)}ctx.restore()}c.toBlob(b=>download(b,'scrapbook.png'))};
defaults();
</script></body></html>
